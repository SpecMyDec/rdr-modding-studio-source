[mypy-rdrstudio.studio]
# 53 errors, down from 359 (REQ-068, the reviewer's rule 4 assignment of the type
# debt to rdr-fmt -- the FILE is still rdr-app's).  49 of the 53 are the same
# None-initialised attribute shape one level down, on Studio itself -- but
# `self.game` is set back to None at line 474, so it is GENUINELY nullable and
# annotating it away would hide a real case rather than describe one.  Those
# want a decision per route about what to answer when there is no disc, which
# is rdr-app's call and not a typing question.  Of the other 4, one is a real
# defect left for rdr-app: studio.py:3561 passes 6 as ZipFile's FOURTH
# positional, which is allowZip64, not compresslevel -- measured, that call
# yields allowZip64=6 and compresslevel=None, so the export zip has never
# used deflate level 6.
check_untyped_defs = False

